<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Puck Market</title>
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0f14;--panel:#121821;--panel2:#18202b;--line:#232d3a;--text:#e8edf3;--mute:#8594a7;
  --a:#3b82f6;--a-soft:rgba(59,130,246,.14);--b:#f97316;--b-soft:rgba(249,115,22,.14);
  --up:#22c55e;--down:#ef4444;--gold:#eab308;
  --r:14px;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top,0) 16px calc(env(safe-area-inset-bottom,0) + 40px)}
.wrap{max-width:980px;margin:0 auto}
a{color:inherit}
button{font:inherit;cursor:pointer;border:0;color:inherit;-webkit-appearance:none;appearance:none}
input,select{font:inherit;color:var(--text)}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.02em}
.brand .puck{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3a4454,#0a0d12 70%);box-shadow:0 0 0 2px #2b3544}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--mute);letter-spacing:0}
.me{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
.chip b{font-family:var(--mono);font-weight:700}
.pos{color:var(--up)}.neg{color:var(--down)}
nav{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto;-webkit-overflow-scrolling:touch}
nav button{background:none;padding:10px 14px;color:var(--mute);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
nav button.on{color:var(--text);border-color:var(--text)}
.weeks{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
.weeks button{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--mute);white-space:nowrap}
.weeks button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.sub{color:var(--mute);font-size:13px;margin:-6px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.mine{border-color:#3a4a60}
.card-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mute)}
.tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:6px;background:var(--panel2)}
.tag.live{color:var(--up)}.tag.lock{color:var(--gold)}.tag.done{color:var(--mute)}
.side{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;background:var(--panel2);border:1px solid transparent;text-align:left;width:100%}
.side .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side .mg{font-size:12px;color:var(--mute)}
.side .px{font-family:var(--mono);font-weight:700;font-size:20px;text-align:right}
.side .px.none{white-space:nowrap;font-size:13px;color:var(--mute)!important;font-family:inherit;font-weight:600}
.side .per{font-size:11px;color:var(--mute);white-space:nowrap;text-align:right}
.side.A .px{color:var(--a)}.side.B .px{color:var(--b)}
.side:hover:not(:disabled){border-color:var(--line)}
.side.sel.A{border-color:var(--a);background:var(--a-soft)}
.side.sel.B{border-color:var(--b);background:var(--b-soft)}
.side:disabled{cursor:default}
.side.won{outline:2px solid var(--up)}
.wait{font-size:13px;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:9px 12px;color:#c9d3df}
.wait b{font-family:var(--mono);font-weight:600}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mute);flex-wrap:wrap}
.meta b{color:var(--text);font-family:var(--mono);font-weight:500}
.ticket{border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:center}
.amt{flex:1;display:flex;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:0 10px;min-width:0}
.amt span{color:var(--mute)}
.amt input{flex:1;min-width:0;background:none;border:0;color:var(--text);font:600 16px var(--mono);padding:10px 6px;outline:none}
.quick button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px}
.go{width:100%;padding:12px;border-radius:10px;font-weight:700;background:var(--a);color:#fff}
.go.B{background:var(--b)}
.go.plain{background:var(--panel2);border:1px solid var(--line);color:var(--text)}
.go:disabled{opacity:.45;cursor:default}
.preview{font-size:13px;color:var(--mute);display:grid;grid-template-columns:1fr auto;gap:2px 10px}
.preview b{color:var(--text);font-family:var(--mono);font-weight:500;text-align:right}
.hold{font-size:13px;background:var(--bg);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.hold button,.sm{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px}
.err{color:var(--down);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--mute);font-weight:600}
th:first-child,td:first-child{text-align:left}
td.n{font-family:var(--mono)}
tr.you td{background:rgba(255,255,255,.03)}
th.ov,td.ov{background:rgba(255,255,255,.045);font-size:16px}th.ov{color:var(--text)}
.scroll{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.feed{display:flex;flex-direction:column;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:6px}
.feed>div{padding:10px;border-radius:8px;font-size:14px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.feed>div:nth-child(odd){background:var(--panel2)}
.feed time{color:var(--mute);font-size:12px;white-space:nowrap}
.how{max-width:680px;color:#c9d3df}
.how h3{margin:22px 0 6px;color:var(--text)}
.how p,.how li{margin:4px 0}
.gate{max-width:440px;margin:12vh auto;text-align:center;color:var(--mute)}
.gate h1{color:var(--text)}
.gate input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin:14px 0 10px;font-size:16px}
.empty{color:var(--mute);padding:30px 0;text-align:center}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:16px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.tile small{display:block;color:var(--mute);font-size:12px}
.tile b{font:700 22px var(--mono)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px;display:flex;flex-direction:column;gap:10px}
.box h3{margin:0;font-size:15px}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.form select,.form input{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:16px;min-width:0;width:100%}
.seg{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{flex:1;background:none;padding:7px 8px;border-radius:7px;font-size:13px;color:var(--mute);font-weight:600}
.seg button.on{background:var(--panel2);color:var(--text)}
.guide{background:var(--panel);border:1px solid #3a4a60;border-radius:var(--r);padding:14px 16px;margin-bottom:16px}
.guide h3{margin:0 0 8px;font-size:15px}.guide ol{margin:0;padding-left:20px}.guide li{margin:5px 0;color:#c9d3df}
.guide .row{justify-content:space-between;margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;opacity:0;transition:.2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty">Loading…</div></div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
var SB = null;
try { SB = supabase.createClient('https://svesriuvprzeuuyocino.supabase.co', 'sb_publishable_PdBtK_rVll5rJvD2SGOFVQ_HR_UUEyq'); } catch (e) {}
const MIN = 10, MAX = 50;   // per bet minimum, per person per matchup maximum (and per person on the season pot)
const FUT = '683-title-2026';   // the season-winner pot

// ---- login link: ?t=<token> (or the old #t=), remembered on this device. The token stays in the
// address bar on purpose, so a home-screen icon or bookmark keeps working in Safari.
function tokenFrom(s) { const m = String(s || '').match(/[?#&]t=([\w-]+)/); return m ? m[1] : null; }
let TOKEN = tokenFrom(location.search) || tokenFrom(location.hash);
try {
  if (TOKEN) localStorage.setItem('pm_tok', TOKEN);
  else TOKEN = localStorage.getItem('pm_tok');
} catch (e) {}
if (TOKEN && location.hash) { try { history.replaceState(null, '', location.pathname + '?t=' + TOKEN); } catch (e) {} }

const S = { me: null, managers: {}, markets: [], mk: {}, bets: [], matches: [], gates: [], wallet: null, bank: null,
  tab: 'markets', week: null, sel: {}, busy: false, bankKind: 'deposit', fut: null, fbets: [], fsel: null };

// ---- helpers ----
const $ = s => document.querySelector(s);
const money = (x, sign) => { const v = Math.round(x * 100) / 100; const s = Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); return (v < 0 ? '-$' : (sign && v > 0 ? '+$' : '$')) + s; };
const pct = p => Math.round(p * 100) + '%';
const cls = v => v > 0.004 ? 'pos' : v < -0.004 ? 'neg' : '';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const name = id => S.managers[id] ? S.managers[id].name : '?';
const fmtT = t => new Date(t).toLocaleString('en-US', { timeZone: 'America/Toronto', weekday: 'short', hour: 'numeric', minute: '2-digit' });
const fmtD = t => new Date(t).toLocaleString('en-US', { timeZone: 'America/Toronto', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
const mirror = o => Math.abs(o) === 100 ? 100 : -o;
const rate = o => o > 0 ? o / 100 : 100 / -o;           // profit per $1
const oddsTxt = o => Math.abs(o) === 100 ? 'EVEN' : (o > 0 ? '+' : '') + o;
const sideOdds = (mk, side) => mk.line_a == null ? null : side === 'a' ? mk.line_a : mirror(mk.line_a);
const unm = b => +b.amount - +b.matched - +b.refunded;
const settled = b => b.payout != null;
const commish = () => Object.values(S.managers).find(m => m.is_commish);
function paused() { const n = Date.now(); return S.gates.find(g => n >= +new Date(g.lock_at) && n < +new Date(g.reopen_at)); }
const isOpen = mk => mk.status === 'open' && new Date(mk.closes_at) > new Date();
const hasLine = mk => mk.line_a != null && mk.line_until && new Date(mk.line_until) > new Date();
const canBet = mk => isOpen(mk) && !paused() && hasLine(mk);
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('on'), 3200); }
function ago(t) { const s = (Date.now() - new Date(t)) / 1000; if (s < 60) return 'now'; if (s < 3600) return Math.floor(s / 60) + 'm'; if (s < 86400) return Math.floor(s / 3600) + 'h'; return Math.floor(s / 86400) + 'd'; }

// what a bet wins if its side wins = the stakes it's matched against (exact, from the match records)
function winsOf(b) {
  let t = 0;
  for (const m of S.matches) { if (b.side === 'a' && m.bet_a === b.id) t += +m.stake_b; else if (b.side === 'b' && m.bet_b === b.id) t += +m.stake_a; }
  return t;
}
// money waiting on a side in the current odds window
const waiting = (mk, side) => S.bets.filter(b => b.market_id === mk.id && b.side === side && !settled(b) && unm(b) > 0.004 && b.window_until && mk.line_until && +new Date(b.window_until) === +new Date(mk.line_until));
const waitSum = (mk, side) => waiting(mk, side).reduce((s, b) => s + unm(b), 0);
// how a new $amt on side would fill right now: matched part, what it wins, what waits
function fill(mk, side, amt) {
  const r = rate(sideOdds(mk, side)), other = waitSum(mk, side === 'a' ? 'b' : 'a');
  const matched = Math.min(amt, other / r);
  return { matched, wins: matched * r, left: amt - matched, winsAll: amt * r };
}
const profitOf = b => +b.payout - +b.matched;
function result(mid, week) {
  let t = 0;
  for (const b of S.bets) {
    if (b.manager_id !== mid || !settled(b)) continue;
    if (week != null && S.mk[b.market_id]?.week !== week) continue;
    t += profitOf(b);
  }
  if (week == null) for (const b of S.fbets) if (b.manager_id === mid) t += fProfit(b);
  return t;
}
const inPlay = (mid, week) => S.bets.filter(b => b.manager_id === mid && !settled(b) && (week == null || S.mk[b.market_id]?.week === week)).reduce((s, b) => s + +b.amount - +b.refunded, 0)
  + (week == null ? S.fbets.filter(b => b.manager_id === mid && b.payout == null).reduce((s, b) => s + +b.amount - +b.refunded, 0) : 0);
// season-winner pot: one pot, everyone on the champion splits it by stake
const fStake = b => +b.amount - +b.refunded;
const fLive = () => S.fbets.filter(b => fStake(b) > 0.004);
const fPot = () => fLive().reduce((s, b) => s + fStake(b), 0);
const fOn = t => fLive().filter(b => b.team === t).reduce((s, b) => s + fStake(b), 0);
const fOpen = () => S.fut && S.fut.status === 'open' && new Date(S.fut.closes_at) > new Date();
const fProfit = b => b.payout == null ? 0 : +b.payout - fStake(b);
const fairOdds = p => { if (!(p > 0 && p < 1)) return null; const o = p >= 0.5 ? -100 * p / (1 - p) : 100 * (1 - p) / p; return Math.round(o / 5) * 5; };
const usedOn = (mid, mkt) => S.bets.filter(b => b.manager_id === mid && b.market_id === mkt).reduce((s, b) => s + +b.amount - +b.refunded, 0);

// ---- data ----
async function load() {
  const [m, mk, g, b, x, me, f, fb] = await Promise.all([
    SB.from('managers').select('*'), SB.from('markets').select('*'), SB.from('gates').select('*'),
    SB.from('bets').select('*').order('at', { ascending: false }).limit(5000),
    SB.from('matches').select('*').limit(20000), SB.rpc('whoami', { tok: TOKEN }),
    SB.from('futures').select('*').eq('id', FUT), SB.from('futures_bets').select('*').eq('future_id', FUT).order('at', { ascending: false }).limit(5000)]);
  if (m.error) throw m.error;
  S.managers = Object.fromEntries(m.data.map(r => [r.id, r]));
  S.markets = mk.data.sort((a, b) => a.week - b.week || a.id.localeCompare(b.id, undefined, { numeric: true }));
  S.mk = Object.fromEntries(S.markets.map(r => [r.id, r]));
  S.bets = b.data || []; S.matches = x.data || []; S.gates = g.data || [];
  if (me.data) S.me = me.data;
  S.fut = (f.data || [])[0] || null; S.fbets = fb.data || [];
  if (S.tab === 'wallet') await loadWallet();
  if (S.tab === 'bank') await loadBank();
  if (S.week == null) {
    const open = S.markets.filter(isOpen).map(r => r.week);
    S.week = open.length ? Math.min(...open) : (S.markets.length ? Math.max(...S.markets.map(r => r.week)) : 1);
  }
}
async function loadWallet() { const r = await SB.rpc('my_wallet', { tok: TOKEN }); S.wallet = r.data || S.wallet || { balance: 0, ledger: [], cashouts: [] }; }
async function loadBank() { const r = await SB.rpc('bank_view', { tok: TOKEN }); S.bank = r.data || S.bank || { people: [], holding: 0, pending: [], ledger: [] }; }
let reT;
function soon() { clearTimeout(reT); reT = setTimeout(async () => { try { await load(); } catch (e) { return; } if (!document.activeElement?.dataset?.keep) render(); }, 300); }

// ---- render ----
function render() {
  const me = S.me, sea = result(me.id, null), risk = inPlay(me.id, null);
  const tabs = [['markets', 'Matchups'], ['title', 'Season winner'], ['wallet', 'Wallet'], ['board', 'Standings'], ['feed', 'Activity'], ['how', 'How it works']];
  if (me.commish) tabs.splice(2, 0, ['bank', 'Bank']);
  $('#app').innerHTML = `
  <header>
    <div class="brand"><div class="puck"></div><div>Puck Market<small>Fantasy Hockey Year 6</small></div></div>
    <div class="me">
      <span class="chip">${esc(me.name)}</span>
      <span class="chip">Balance <b>${money(+me.balance)}</b></span>
      ${risk ? `<span class="chip">In bets <b>${money(risk)}</b></span>` : ''}
      <span class="chip">Overall <b class="${cls(sea)}">${money(sea, 1)}</b></span>
    </div>
  </header>
  <nav>${tabs.map(([k, l]) => `<button data-tab="${k}" class="${S.tab === k ? 'on' : ''}">${l}</button>`).join('')}</nav>
  <main>${({ markets: viewMarkets, title: viewTitle, wallet: viewWallet, bank: viewBank, board: viewBoard, feed: viewFeed, how: viewHow })[S.tab]()}</main>`;
}

function weekBar() {
  const ws = [...new Set(S.markets.map(m => m.week))].sort((a, b) => a - b);
  return `<div class="weeks">${ws.map(w => `<button data-week="${w}" class="${w === S.week ? 'on' : ''}">Week ${w}</button>`).join('')}</div>`;
}

function viewMarkets() {
  const list = S.markets.filter(m => m.week === S.week);
  if (!list.length) return weekBar() + `<div class="empty">No matchups open yet. Next week's matchups open about 7 days before it starts.</div>`;
  const open = isOpen(list[0]), pz = paused(), lu = list.find(hasLine)?.line_until;
  const status = !open ? (list[0].status === 'resolved' ? 'This week is settled.' : '<b>Betting is closed for this week.</b> Every bet is locked in until the week ends. Next week opens about 7 days before it starts.')
    : pz ? `<b>Games are on, betting is paused.</b> New odds post ${fmtT(pz.reopen_at)} ET with the overnight scores in.`
    : lu ? `<b>Betting is open until the week starts, ${fmtT(list[0].closes_at)} ET.</b> Then every bet is locked for the whole week. Today's odds hold until ${fmtT(lu)} ET${+new Date(lu) < +new Date(list[0].closes_at) - 60000 ? ', then new odds post (trades and adds count) and anything nobody took comes back to your balance' : ''}.`
    : 'New odds are posting, give it a minute.';
  const bal = +S.me.balance;
  return guide() + weekBar() + `<p class="sub">${status}</p>
    ${bal < MIN && open ? `<div class="wait" style="margin-bottom:14px">Your balance is ${money(bal)}. To bet, e-Transfer ${esc(commish()?.name || 'the commish')} and they'll add it to your balance. Bets are $${MIN} to $${MAX} per matchup.</div>` : ''}
    <div class="grid">${list.map(card).join('')}</div>`;
}

let hideGuide = false; try { hideGuide = localStorage.getItem('pm_guide') === 'off'; } catch (e) {}
function guide() {
  const c = esc(commish()?.name || 'the commish');
  if (hideGuide) return `<div style="text-align:right;margin:-8px 0 8px"><button class="sm" data-guide="on">How do I bet?</button></div>`;
  return `<div class="guide"><h3>How to bet, in 6 steps</h3><ol>
    <li><b>Add money:</b> e-Transfer ${c}. ${c} adds it to your balance here (top of the page).</li>
    <li><b>Pick a team</b> on any matchup below and type an amount. $${MIN} minimum, $${MAX} max per matchup.</li>
    <li><b>Read the odds.</b> <b>-200</b> = favourite: bet $10 to win up to $5. <b>+200</b> = underdog: bet $10 to win up to $20. <b>EVEN</b> = bet $10 to win $10. Your odds lock in when you bet.</li>
    <li><b>Wait for a friend to take the other side.</b> There's no house, so a friend has to bet against you. <b>You only win on the part of your bet that gets matched.</b> Before you confirm, the site tells you how much matches right away. Anything nobody takes comes back to your balance at the next 8 AM reset or when betting closes, or cancel it yourself.</li>
    <li><b>Bets close at the week's first puck drop</b> and stay locked all week.</li>
    <li><b>Get paid.</b> The morning after the week ends, winnings land in your balance. Cash out from the Wallet tab.</li>
  </ol><div class="row"><span class="sub" style="margin:0">More detail in "How it works".</span><button class="sm" data-guide="off">Got it, hide this</button></div></div>`;
}
function card(mk) {

  const canA = live && !(mine && me === mk.team_b), canB = live && !(mine && me === mk.team_a);

  return `<div class="card ${mine ? 'mine' : ''}">

    ${sideBtn(mk, 'b', B, canB, sel && sel.side === 'b', done && mk.winner === 'b')}

    <div class="meta">${score || '<span>Not started</span>'}${mk.model_a != null ? `<span>Proj final <b>${(+mk.model_a).toFixed(0)} - ${(+mk.model_b).toFixed(0)}</b></span>` : ''}</div>
    ${myRows(mk, my, done)}

}
function sideBtn(mk, side, M, can, on, won) {
  const o = sideOdds(mk, side);
  const right = o == null ? `<div class="px none">${mk.status === 'resolved' ? '' : 'Odds at 8 AM'}</div>`
    : `<div class="px">${oddsTxt(o)}</div><div class="per">$10 wins up to ${money(10 * rate(o))}</div><div class="per">${mk.status === 'open' && hasLine(mk) ? (fill(mk, side, 10).left < 0.005 ? '<span class="pos">ready to match</span>' : 'needs someone on the other side') : ''}</div>`;
  return `<button class="side ${side === 'a' ? 'A' : 'B'} ${on ? 'sel' : ''} ${won ? 'won' : ''}" data-pick="${mk.id}|${side}" ${can ? '' : 'disabled'}>
    <div style="min-width:0"><div class="nm">${esc(M.team)}</div><div class="mg">${esc(M.name)}${won ? ' · won' : ''}</div></div>
    <div>${right}</div></button>`;
}
function waitRows(mk) {
  const out = [];
  for (const side of ['a', 'b']) {
    const w = waitSum(mk, side); if (w < 0.01) continue;
    const other = side === 'a' ? 'b' : 'a', who = name(side === 'a' ? mk.team_a : mk.team_b), opp = name(other === 'a' ? mk.team_a : mk.team_b);
    const oo = sideOdds(mk, other), need = w * rate(sideOdds(mk, side));
    if (need >= MIN - 0.004) {
      out.push(`<div class="wait"><b>${money(w)}</b> on ${esc(who)} is waiting for someone to bet against it. Bet between $${MIN} and <b>${money(Math.min(need, MAX))}</b> on ${esc(opp)} (${oddsTxt(oo)}) and all of your bet matches right away.</div>`);
    } else {
      const f = fill(mk, other, MIN);
      out.push(`<div class="wait"><b>${money(w)}</b> on ${esc(who)} is waiting for someone to bet against it. A $${MIN} bet on ${esc(opp)} (${oddsTxt(oo)}) would match <b>${money(f.matched)}</b> of it right away (wins ${money(f.wins)} if ${esc(opp)} wins). The other ${money(f.left)} of your $${MIN} would wait for another taker.</div>`);
    }
  }
  return out.join('');
}
function myRows(mk, my, done) {
  return my.map(b => {
    const who = name(b.side === 'a' ? mk.team_a : mk.team_b), w = winsOf(b), u = unm(b);
    if (settled(b)) {
      const p = profitOf(b);
      return `<div class="hold"><div>${money(+b.matched)} on ${esc(who)} at ${oddsTxt(b.odds)}${+b.refunded ? ` <span style="color:var(--mute)">(${money(+b.refunded)} came back unmatched)</span>` : ''}</div><b class="${cls(p)}">${+b.matched ? money(p, 1) : 'refunded'}</b></div>`;
    }
    const parts = [];
    if (+b.matched) parts.push(`<b>${money(+b.matched)}</b> matched, wins <span class="pos">${money(w)}</span>`);
    if (u > 0.004) parts.push(`<b>${money(u)}</b> waiting for a taker`);
    if (+b.refunded && !parts.length) parts.push(`nobody took it, ${money(+b.refunded)} back in your balance`);
    else if (+b.refunded) parts.push(`<span style="color:var(--mute)">${money(+b.refunded)} came back</span>`);
    return `<div class="hold"><div>${money(+b.amount)} on ${esc(who)} at <b>${oddsTxt(b.odds)}</b><br><span style="color:var(--mute)">${parts.join(' · ')}</span></div>
      ${u > 0.004 && !done ? `<button data-cancel="${b.id}">Cancel ${money(u)}</button>` : ''}</div>`;
  }).join('');
}
function ticket(mk, sel) {
  const amt = +sel.amt || 0, bal = +S.me.balance, room = Math.max(0, MAX - usedOn(S.me.id, mk.id));
  const o = sideOdds(mk, sel.side), who = name(sel.side === 'a' ? mk.team_a : mk.team_b);
  let pv = '', err = '';
  if (amt > 0) {
    const f = fill(mk, sel.side, amt);
    pv = `<div class="preview">
      <span>Matches right now</span><b>${money(f.matched)}</b>
      ${f.matched > 0.004 ? `<span>If ${esc(who)} wins, that pays</span><b class="pos">${money(f.matched + f.wins)} (${money(f.wins, 1)})</b>` : ''}
      ${f.left > 0.004 ? `<span>Waits for a taker</span><b>${money(f.left)}</b>` : ''}
    </div>${f.left > 0.004 ? `<div class="sub" style="margin:0">${f.matched > 0.004 ? '' : '<b style="color:var(--text)">Nobody is on the other side yet, so none of this is matched.</b> '}You only win on money that gets matched. If someone takes the waiting ${money(f.left)}, it wins ${money(f.left * rate(o))} more. If nobody does by ${fmtT(mk.line_until)} ET, it comes back to your balance. You can cancel it any time.</div>` : ''}`;
  }
  if (amt > 0 && amt < MIN) err = `Minimum bet is $${MIN}.`;
  else if (amt > room + 1e-9) err = room < MIN ? `You're at the $${MAX} max on this matchup.` : `Max is $${MAX} per matchup. You can add ${money(room)} more here.`;
  else if (amt > bal + 1e-9) err = `Your balance is ${money(bal)}. e-Transfer ${esc(commish()?.name || 'the commish')} to add more.`;
  return `<div class="ticket">
    <div class="sub" style="margin:0">${esc(who)} at <b style="color:var(--text)">${oddsTxt(o)}</b>: every $10 wins ${money(10 * rate(o))}.</div>
    <div class="row"><div class="amt"><span>$</span><input inputmode="decimal" placeholder="${MIN}" value="${sel.amt || ''}" data-amt="${mk.id}" data-keep="1"></div>
      <div class="row quick">${[10, 25, 50].map(v => `<button data-set="${mk.id}|${v}">$${v}</button>`).join('')}</div></div>
    ${pv}
    ${err ? `<div class="err">${err}</div>` : ''}
    <button class="go ${sel.side === 'b' ? 'B' : ''}" data-buy="${mk.id}" ${amt >= MIN && !err && !S.busy ? '' : 'disabled'}>Bet ${amt > 0 ? money(amt) + ' on ' : 'on '}${esc(who)}</button>
  </div>`;
}

function viewTitle() {
  const F = S.fut;
  if (!F) return `<div class="empty">The season-winner pot isn't posted yet.</div>`;
  const open = fOpen(), done = F.status === 'resolved', pot = fPot(), me = S.me.id, c = esc(commish()?.name || 'the commish');
  const mine = S.fbets.filter(b => b.manager_id === me), used = mine.reduce((s, b) => s + fStake(b), 0);
  const odds = F.odds || {}, info = F.info || {};
  const teams = Object.values(S.managers).map(m => ({ m, p: +odds[m.id] || 0, i: info[m.id] || {}, on: fOn(m.id) }));
  // order: 60% title-chance rank + 40% projected-record rank (they still have to make the playoffs), title breaks ties
  [...teams].sort((a, b) => b.p - a.p).forEach((t, i) => (t.tr = i + 1));
  teams.forEach((t) => (t.sc = 0.6 * t.tr + 0.4 * (t.i.rank || 99)));
  teams.sort((a, b) => a.sc - b.sc || a.tr - b.tr);
  const status = done ? `<b>Settled.</b> Champion: ${esc(S.managers[F.winner]?.team || '?')} (${esc(name(F.winner))}).`
    : open ? `<b>Betting is open until the season starts, ${fmtD(F.closes_at)} ET.</b> Then every bet is locked until the champion is crowned after the fantasy final.`
    : '<b>Betting is closed.</b> Every bet is locked until the champion is crowned after the fantasy final.';
  const sel = S.fsel;
  const rows = teams.map((t, i) => {
    const on = sel && sel.team === t.m.id, won = done && F.winner === t.m.id;
    const pays10 = (pot + 10) * 10 / (t.on + 10);
    const fo = fairOdds(t.p);
    return `<button class="side A ${on ? 'sel' : ''} ${won ? 'won' : ''}" data-fpick="${t.m.id}" ${open ? '' : 'disabled'}>
      <div style="min-width:0"><div class="nm">${i + 1}. ${esc(t.m.team)}</div><div class="mg">${esc(t.m.name)}${t.i.wins != null ? ` · proj ${(+t.i.wins).toFixed(1)}-${(+t.i.losses).toFixed(1)} · playoffs ${pct(+t.i.make)}` : ''}${won ? ' · champion' : ''}</div>
        <div class="mg">${t.on ? `<b style="color:var(--text)">${money(t.on)}</b> on them` : 'Nobody on them yet'}</div></div>
      <div><div class="px">${pct(t.p)}</div><div class="per">title chance${fo ? ' (' + oddsTxt(fo) + ')' : ''}</div>${open ? `<div class="per">${!pot ? 'pot is empty so far' : !t.on ? `$10 takes the whole ${money(pot + 10)}` : `$10 pays ${money(pays10)} now`}</div>` : ''}</div></button>`;
  }).join('');
  let tk = '';
  if (sel && open) {
    const t = S.managers[sel.team], amt = +sel.amt || 0, room = Math.max(0, MAX - used), bal = +S.me.balance;
    let err = '';
    if (amt > 0 && amt < MIN) err = `Minimum bet is $${MIN}.`;
    else if (amt > room + 1e-9) err = room < MIN ? `You're at the $${MAX} max on the season winner.` : `Max is $${MAX} per person on the season winner. You can add ${money(room)} more.`;
    else if (amt > bal + 1e-9) err = `Your balance is ${money(bal)}. e-Transfer ${c} to add more.`;
    const onT = fOn(sel.team), share = amt > 0 ? (pot + amt) * amt / (onT + amt) : 0;
    tk = `<div class="card" style="margin:12px 0"><div class="ticket" style="border:0;padding:0">
      <div class="sub" style="margin:0">Bet on <b style="color:var(--text)">${esc(t.team)}</b> (${esc(t.name)}) to win the league.</div>
      <div class="row"><div class="amt"><span>$</span><input inputmode="decimal" placeholder="${MIN}" value="${sel.amt || ''}" data-famt="1" data-keep="1"></div>
        <div class="row quick">${[10, 25, 50].map(v => `<button data-fset="${v}">$${v}</button>`).join('')}</div></div>
      ${amt > 0 ? `<div class="preview"><span>Pot after your bet</span><b>${money(pot + amt)}</b><span>On ${esc(name(sel.team))} after your bet</span><b>${money(onT + amt)}</b>
        <span>If ${esc(name(sel.team))} wins and nothing else changes, you get</span><b class="pos">${money(share)} (${money(share - amt, 1)})</b></div>
        <div class="sub" style="margin:0">That number moves as people bet: more money on other teams = a bigger payout, more money on ${esc(name(sel.team))} = a smaller one.</div>` : ''}
      ${err ? `<div class="err">${err}</div>` : ''}
      <button class="go" data-fbuy="1" ${amt >= MIN && !err && !S.busy ? '' : 'disabled'}>Bet ${amt > 0 ? money(amt) + ' on ' : 'on '}${esc(name(sel.team))}</button></div></div>`;
  }
  const myHtml = mine.length ? `<div class="box"><h3>Your season-winner bets</h3>${mine.map(b => {
    const who = esc(S.managers[b.team]?.team || '?');
    if (+b.refunded >= +b.amount) return `<div class="hold"><div>${money(+b.amount)} on ${who}</div><span style="color:var(--mute)">cancelled, back in your balance</span></div>`;
    if (b.payout != null) return `<div class="hold"><div>${money(fStake(b))} on ${who}</div><b class="${cls(fProfit(b))}">${money(fProfit(b), 1)}</b></div>`;
    const onT = fOn(b.team), now = onT ? pot * fStake(b) / onT : 0;
    return `<div class="hold"><div>${money(fStake(b))} on ${who}<br><span style="color:var(--mute)">pays ${money(now)} right now if they win</span></div>${open ? `<button data-fcancel="${b.id}">Cancel</button>` : ''}</div>`;
  }).join('')}</div>` : '';
  return `<p class="sub">${status}</p>
    <div class="tiles"><div class="tile"><small>Total pot</small><b>${money(pot)}</b></div><div class="tile"><small>Bets in the pot</small><b>${fLive().length}</b></div><div class="tile"><small>Your money in it</small><b>${money(used)}</b></div></div>
    <div class="guide"><h3>How the season-winner pot works</h3><ol>
      <li><b>One pot.</b> Pick the team you think wins the league. Everyone's money goes into the same pot.</li>
      <li><b>Winners split everything.</b> Everyone who backed the champion splits the whole pot by how much they put in. $${MIN} minimum, $${MAX} max per person in total. No cut.</li>
      <li><b>Bets close when the season starts</b> (${fmtD(F.closes_at)} ET). Until then you can cancel. After that, everything is locked until the fantasy final.</li>
      <li><b>If nobody backed the champion,</b> everyone gets their money back.</li>
    </ol><div class="sub" style="margin:8px 0 0">Teams are ranked mostly on title chance but also on projected record, since they still have to make the playoffs (60% title chance, 40% record). Both come from the Off-Night projected standings: every team's real Yahoo roster played through the real schedule with daily best lineups, then 20,000 simulated seasons and playoffs. It's a guide. Payouts come only from the pot.</div></div>
    ${myHtml}${tk}
    <div style="display:flex;flex-direction:column;gap:8px">${rows}</div>`;

  <div class="scroll"><table><thead><tr><th>#</th><th style="text-align:left">Manager</th><th class="ov">Overall</th>${ws.map(w => `<th>Wk ${w}</th>`).join('')}<th>In bets</th></tr></thead><tbody>
  ${rows.map((r, i) => `<tr class="${r.m.id === S.me.id ? 'you' : ''}"><td>${i + 1}</td><td style="text-align:left"><b>${esc(r.m.name)}</b><br><span style="color:var(--mute);font-size:12px">${esc(r.m.team)}</span></td>
    <td class="n ov ${cls(r.sea)}"><b>${money(r.sea, 1)}</b></td>${r.w.map(v => `<td class="n ${cls(v)}">${Math.abs(v) < .005 ? '-' : money(v, 1)}</td>`).join('')}<td class="n">${r.risk ? money(r.risk) : '-'}</td></tr>`).join('')}
  </tbody></table></div>`;
}

function viewFeed() {
  if (!S.bets.length && !S.fbets.length) return `<div class="empty">No bets yet. Be the first.</div>`;
  const all = [...S.bets, ...S.fbets.map(b => Object.assign({ fut: 1 }, b))].sort((a, b) => new Date(b.at) - new Date(a.at));
  return `<div class="feed">${all.slice(0, 200).map(b => {
    if (b.fut) {
      const st = +b.refunded >= +b.amount ? ' <span style="color:var(--mute)">· cancelled</span>' : b.payout != null ? ` <span class="${cls(fProfit(b))}">${money(fProfit(b), 1)}</span>` : '';
      return `<div><span><b>${esc(name(b.manager_id))}</b> put ${money(+b.amount)} on <b>${esc(name(b.team))}</b> to win the league <span style="color:var(--mute)">· season pot</span>${st}</span><time>${ago(b.at)}</time></div>`;
    }
    const mk = S.mk[b.market_id]; if (!mk) return '';
    const on = name(b.side === 'a' ? mk.team_a : mk.team_b), opp = name(b.side === 'a' ? mk.team_b : mk.team_a);
    const st = settled(b) ? (+b.matched ? ` <span class="${cls(profitOf(b))}">${money(profitOf(b), 1)}</span>` : ' <span style="color:var(--mute)">refunded</span>')
      : unm(b) > 0.004 ? ` <span style="color:var(--mute)">· ${money(unm(b))} waiting</span>` : +b.matched ? ' <span style="color:var(--mute)">· matched</span>' : ' <span style="color:var(--mute)">· nobody took it</span>';
    return `<div><span><b>${esc(name(b.manager_id))}</b> put ${money(+b.amount)} on <b>${esc(on)}</b> ${oddsTxt(b.odds)} over ${esc(opp)} <span style="color:var(--mute)">· wk ${mk.week}</span>${st}</span><time>${ago(b.at)}</time></div>`;
  }).join('')}</div>`;
}

function viewHow() {
  const c = esc(commish()?.name || 'the commish');
  return `<div class="how">
  <h3>The idea</h3><p>Real money, friends only, no house. Every head-to-head matchup in Fantasy Hockey Year 6 has odds. You bet on a team, and a friend has to take the other side. Nobody takes a cut, so every dollar someone wins is a dollar someone else lost.</p>
  <h3>Season-winner pot</h3><p>On the Season winner tab you can also bet on who wins the whole league. That one works differently: it's one pot, and everyone who backed the champion splits all of it by how much they put in. $${MIN} to $${MAX} per person, bets close when the season starts, and if nobody backed the champion everyone gets their money back.</p>
  <h3>Your money</h3><ul><li>To add money, e-Transfer ${c}. ${c} adds it to your balance on the site.</li><li>You can only bet what's in your balance.</li><li>To cash out, go to Wallet and ask for a cash-out. It comes off your balance and ${c} e-Transfers you.</li></ul>
  <h3>How the odds work</h3><ul><li>The odds come from the Off-Night Projections model (score so far + projection for the games left, current rosters). <b>-330</b> means bet $330 to win $100. <b>+330</b> means bet $100 to win $330. <b>EVEN</b> means bet $10 to win $10.</li><li>Example at -330 / +330: $10 on the favourite wins $3.03. To match it, someone puts $3.03 on the underdog and wins $10 if the underdog wins. Each side puts up what the other side would win.</li><li><b>Your odds lock in when you bet.</b> Until the week starts, new odds post every morning at 8 AM ET, so adds, drops and trades count.</li><li>"Model now" on each matchup is the live model. When it moves away from the locked odds, one side is a good deal.</li></ul>
  <h3>Example: $10 on each side</h3><p>Adriano is <b>-245</b>, David is <b>+245</b> (the model gives Adriano about a 71% chance). One friend bets $10 on Adriano, another bets $10 on David.</p><ul><li>$10 on Adriano at -245 wins $4.08. So only <b>$4.08</b> of the David bet is needed to match it. The other <b>$5.92</b> of the David bet waits for someone else.</li><li><b>If David wins:</b> the David bettor wins the Adriano bettor's $10 (risking $4.08). The unmatched $5.92 comes back.</li><li><b>If Adriano wins:</b> the Adriano bettor wins $4.08. The David bettor loses $4.08, and the unmatched $5.92 comes back.</li><li>So "$10 on David wins $24.50" only happens if people put a total of $24.50 on Adriano. You never win more than the other side put in.</li></ul>
  <h3>When can I bet?</h3><p>Only before the week starts. Each week's matchups open about 7 days early, and betting closes at that week's first puck drop. Nothing can be added, cancelled or changed during the week.</p>
  <h3>Getting matched</h3><ul><li>When you bet, it matches right away against money waiting on the other side. Whatever isn't matched waits for a taker. The site shows you exactly how much matches before you confirm.</li><li>The card shows what's waiting, e.g. "$50 on Jaeden is waiting. Bet between $10 and $12.20 on Daniel and all of your bet matches right away."</li><li>You can cancel waiting money any time. If nobody takes it before the odds reset, it comes back to your balance automatically.</li><li>You only win on matched money. If none of your bet gets matched, you just get it all back: no win, no loss.</li><li>Matched money is locked in until the matchup settles.</li></ul>
  <h3>Rules</h3><ul><li>Minimum bet <b>$${MIN}</b>. Maximum <b>$${MAX}</b> per person per matchup.</li><li>In your own matchup you can only back yourself, never bet against yourself.</li><li>Matchups open about a week early. <b>All bets must be in before the week's first puck drop.</b> After that, betting on that week is closed and every bet is locked until the week ends.</li><li>While NHL games are on (first puck drop until 8 AM), betting pauses.</li><li>Matchups settle the morning after the week ends, from the Yahoo scoreboard. Winnings land in your balance. A tie refunds everyone.</li></ul>
  <h3>Your link</h3><p>Your personal link logs you in. Don't share it, or someone else can bet with your money. On iPhone you can tap Share, then Add to Home Screen, to keep it as an app.</p></div>`;
}

// ---- events ----
async function call(fn, args, ok) {
  if (S.busy) return; S.busy = true;
  const { data, error } = await SB.rpc(fn, Object.assign({ tok: TOKEN }, args));
  S.busy = false;
  if (error) { toast(error.message); render(); return null; }
  if (ok) toast(ok(data));
  await load(); render(); return data;
}
function confirmTap(t, label) { if (t.dataset.confirm === '1') return true; t.dataset.confirm = '1'; t.textContent = label; return false; }
document.addEventListener('click', async e => {
  const t = e.target.closest('button'); if (!t) return;
  const d = t.dataset;
  if (d.tab) { S.tab = d.tab; render(); if (d.tab === 'wallet') loadWallet().then(render); if (d.tab === 'bank') loadBank().then(render); return; }
  if (d.week) { S.week = +d.week; render(); return; }
  if (d.fpick) { const tm = +d.fpick; S.fsel = S.fsel && S.fsel.team === tm ? null : { team: tm, amt: S.fsel?.amt || '' }; render(); if (S.fsel) { const el = document.querySelector('input[data-famt]'); if (el) { el.focus(); el.scrollIntoView({ block: 'center' }); } } return; }
  if (d.fset) { S.fsel.amt = d.fset; render(); return; }
  if (d.fbuy) {
    const sel = S.fsel;
    if (!confirmTap(t, `Tap again to bet ${money(+sel.amt)} on ${name(sel.team)}`)) return;
    const r = await call('place_future', { fut: FUT, pick: sel.team, amount: +sel.amt }, x => `${money(+x.amount)} on ${name(sel.team)} is in the pot. Good luck.`);
    if (r) { S.fsel = null; render(); }
    return;
  }
  if (d.fcancel) { if (!confirmTap(t, 'Tap again to cancel')) return; await call('cancel_future', { bet: +d.fcancel }, x => `${money(+x.refunded)} is back in your balance`); return; }
  if (d.pick) { const [id, side] = d.pick.split('|'); const cur = S.sel[id]; S.sel[id] = cur && cur.side === side ? null : { side, amt: cur?.amt || '' }; render(); focusAmt(id); return; }
  if (d.set) { const [id, v] = d.set.split('|'); S.sel[id].amt = v; render(); return; }
  if (d.buy) {
    const sel = S.sel[d.buy];
    if (!confirmTap(t, `Tap again to bet ${money(+sel.amt)}`)) return;
    const r = await call('place_bet', { mkt: d.buy, pick: sel.side, amount: +sel.amt },
      x => +x.waiting > 0.004 ? `${money(+x.matched)} matched, ${money(+x.waiting)} waiting for a taker` : `${money(+x.matched)} matched. Good luck.`);
    if (r) { S.sel[d.buy] = null; render(); }
    return;
  }
  if (d.cancel) { if (!confirmTap(t, 'Tap again to cancel')) return; await call('cancel_unmatched', { bet: +d.cancel }, x => `${money(+x.refunded)} is back in your balance`); return; }
  if (d.coall) { $('#coAmt').value = (+S.me.balance).toFixed(2); return; }
  if (d.co) {
    const amt = +($('#coAmt').value || '').replace(/[^0-9.]/g, '');
    if (!(amt > 0)) { toast('Enter an amount'); return; }
    if (!confirmTap(t, `Tap again to cash out ${money(amt)}`)) return;
    await call('request_cashout', { amount: amt }, x => `Asked for ${money(+x.amount)}. ${commish()?.name || 'The commish'} will e-Transfer you.`); return;
  }
  if (d.uncash) { if (!confirmTap(t, 'Tap again')) return; await call('cancel_cashout', { req: +d.uncash }, x => `Cancelled, ${money(+x.amount)} back in the balance`); return; }
  if (d.paid) { if (!confirmTap(t, 'Tap again: sent?')) return; await call('bank_pay', { req: +d.paid }, x => `Marked ${money(+x.amount)} as paid`); return; }
  if (d.guide) { hideGuide = d.guide === 'off'; try { localStorage.setItem('pm_guide', d.guide); } catch (e) {} render(); return; }
  if (d.kind) { S.bankKind = d.kind; render(); return; }
  if (d.move) {
    const who = +$('#bkWho').value, raw = ($('#bkAmt').value || '').replace(/[^0-9.\-]/g, ''), amt = +raw, note = $('#bkNote').value;
    if (!amt || (S.bankKind !== 'fix' && amt < 0)) { toast('Enter an amount'); return; }
    const verb = S.bankKind === 'deposit' ? `add ${money(amt)} to ${name(who)}` : S.bankKind === 'cashout' ? `cash out ${money(amt)} from ${name(who)}` : `apply ${money(amt, 1)} to ${name(who)}`;
    if (!confirmTap(t, `Tap again to ${verb}`)) return;
    await call('bank_move', { who, kind: S.bankKind, amount: amt, note }, x => `Done. ${name(who)}'s balance: ${money(+x.balance)}`); return;
  }
});
document.addEventListener('input', e => {
  if (e.target.dataset.famt) {
    S.fsel.amt = e.target.value.replace(/[^0-9.]/g, '');
    const pos = e.target.selectionStart; render();
    const el = document.querySelector('input[data-famt]'); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (x) {} }
    return;
  }
  const id = e.target.dataset.amt; if (!id) return;
  S.sel[id].amt = e.target.value.replace(/[^0-9.]/g, '');
  const pos = e.target.selectionStart; render(); focusAmt(id, pos);
});
function focusAmt(id, pos) { const el = document.querySelector(`input[data-amt="${id}"]`); if (el) { el.focus(); if (pos != null) try { el.setSelectionRange(pos, pos); } catch (e) {} } }

// ---- start ----
function gate(title, msg) {
  $('#app').innerHTML = `<div class="gate"><div class="brand" style="justify-content:center"><div class="puck"></div>Puck Market</div><h1>${title}</h1><p>${msg}</p>
    <input id="paste" placeholder="Paste your personal link here" autocapitalize="off" autocorrect="off"><button class="go" id="pasteGo">Log in</button></div>`;
  $('#pasteGo').onclick = () => { const tk = tokenFrom($('#paste').value) || ($('#paste').value.trim().match(/^[\w-]{8,}$/) || [])[0]; if (!tk) { toast("That doesn't look like a Puck Market link"); return; } location.href = location.pathname + '?t=' + tk; };
}
(async function () {
  if (!SB) { gate("Couldn't load", 'Check your connection and reload the page.'); return; }
  if (!TOKEN) { gate('Private league market', 'Open this site with your personal link from the league commish, or paste it below.'); return; }
  const { data, error } = await SB.rpc('whoami', { tok: TOKEN });
  if (error) { gate("Couldn't connect", 'The site is having trouble reaching the server. Try again in a minute.'); return; }
  if (!data) { try { localStorage.removeItem('pm_tok'); } catch (e) {} gate("That link didn't work", 'Ask the commish for your personal link again, or paste it below.'); return; }
  S.me = data;
  SB.rpc('tick');   // settles any odds window that just ended
  await load(); render();
  SB.channel('pm').on('postgres_changes', { event: '*', schema: 'public' }, soon).subscribe();
  setInterval(soon, 20000);   // backup in case the live connection drops (phone asleep, bad Wi-Fi)
  document.addEventListener('visibilitychange', () => { if (!document.hidden) soon(); });
})();
</script>
</body>
